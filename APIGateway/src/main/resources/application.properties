spring.application.name=APIGATEWAY
server.port=8082

# --- Who is allowed to reach this service?  (Track B1, step 1 - 2026-09-01) ---
# Before this, the service listened on 0.0.0.0. That means "any network can reach me".
# So anyone who could reach this laptop could skip the gateway and call this service
# directly, sending fake X-User-Id / X-Roles headers and being believed.
#
# 127.0.0.1 means "only this machine". Other computers cannot even connect.
# Real companies do the same thing with a private network or a firewall rule.
#
# BOTH lines are needed, and this is the part that is easy to get wrong:
#   server.address            = which network card we listen on
#   eureka.instance.ip-address = the address we TELL Eureka to give other services
#
# We already have eureka.instance.prefer-ip-address=true, which means "hand out my IP
# address". Without the second line it would keep handing out the laptop LAN address
# (192.168.x.x) while only listening on 127.0.0.1. Then the gateway would call an
# address nothing is listening on, and every service call would fail.
server.address=127.0.0.1
#And this is the IP address to give.
eureka.instance.ip-address=127.0.0.1

# --- The secret handshake  (Track B1, step 2 - 2026-09-02) ---
# We send this word to every service with every request we pass on.
# The service checks it before it believes the X-User-Id / X-Roles headers we add.
#
# Why: those headers are just text. Without this check, anyone who reaches a service directly
# could type "X-Roles: ROLE_ADMIN" and be believed. Step 1 stopped outsiders reaching the
# services at all. This is the second lock, in case the first is ever undone by mistake.
#
# The value comes from the internalsecret environment variable. There is NO default on purpose:
# if it is missing, the gateway refuses to start. A loud failure is much safer than quietly
# starting up and sending no secret at all.
internal.secret=${internalsecret}



eureka.client.service-url.defaultZone=http://localhost:8081/eureka/
#"Give other services my IP address, not my computer name."
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTHSERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**,/roles/**,/logout/**,/password/**,/credentials/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USERSERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[2].id=incident-service
spring.cloud.gateway.routes[2].uri=lb://IncidentService
spring.cloud.gateway.routes[2].predicates[0]=Path=/incidents/**

spring.cloud.gateway.routes[3].id=report-service
spring.cloud.gateway.routes[3].uri=lb://ReportingService
spring.cloud.gateway.routes[3].predicates[0]=Path=/reports/**

spring.cloud.gateway.routes[4].id=ai-service
spring.cloud.gateway.routes[4].uri=lb://AiService
spring.cloud.gateway.routes[4].predicates[0]=Path=/ai/**


jwt.secret=${secretkey}
jwt.expirationMs=3600000

# ==========================================================================================
# --- Time limits on our call to AuthService  (Track B3, step 1 - 2026-09-09) ---
#
# WHY THIS MATTERS MORE HERE THAN ANYWHERE ELSE
# The gateway asks AuthService for the token version on EVERY single request. So this one
# call sits in front of the whole platform. If it can hang, everything can hang.
#
# Before this, there was no time limit at all. A slow AuthService did not make us slow -
# it broke us permanently, because connections were borrowed and never given back.
# The full explanation is in WebClientConfig.java, next to the code that uses these.
#
# HOW THESE NUMBERS WERE CHOSEN
# Not by feel. The rule is: "how long is this call allowed to take before waiting longer
# is pointless?" The call is a single lookup of one row by its primary key. On a healthy
# system it takes a few milliseconds. If it has taken 2 seconds, AuthService is already in
# trouble, and waiting 10 seconds will not rescue it - it will only drag us down too.
#
# These are a starting point, not a final answer. Once we can see real numbers (Track B3
# step 5 turns on metrics) we tune them from what actually happens instead of guessing.
# ==========================================================================================

# "Nobody answered the door." AuthService is on this same machine, so connecting should be
# almost instant. 2 seconds is already very generous.
gateway.httpclient.connect-timeout-ms=2000

# "They answered the door but never spoke."
# THIS IS THE IMPORTANT ONE - it is the setting whose absence caused the whole problem.
# A connect timeout does not help us here, because a struggling service still accepts the
# connection perfectly well. It just never replies.
gateway.httpclient.response-timeout-ms=2000

# How many connections we keep open to any one service.
# The built-in default is small - about 16 on a normal laptop - which surprises people who
# assume it is in the hundreds. 50 gives comfortable room. It gets even less pressured in
# step 3, when we cache the token version and stop making most of these calls at all.
gateway.httpclient.max-connections=50

# If all 50 are busy, this many requests may wait in line. Beyond this request (50 request have  connection +100 reqests in waiting queue)so total 150 requests   after that for 151 th request
# directly  reject the request instead of  letting the queue grow in memory until the app falls over.
gateway.httpclient.pending-acquire-max-count=100

# How long a request waits in that line before giving up.
# The built-in default is 45 SECONDS. That is the worst default in this whole area: a user
# would wait 45 seconds just to find out we never even got a connection to try with.
gateway.httpclient.pending-acquire-timeout-ms=2000

# Close our unused connections after 15 seconds.
# Here's the problem we're avoiding: AuthService closes its idle connections after ~20 seconds.
# If it closes one without us noticing, our next call picks up that dead connection and fails with
# "Connection prematurely closed BEFORE response" - a confusing error because we didn't close it.
# Solution: we close first at 15s. This way we never hold a connection that's already dead on their end.
# Not about speed - just avoiding that specific error and the confusion it causes.
gateway.httpclient.max-idle-time-ms=15000

# WORST CASE, ADDED UP: 2s waiting for a free connection + 2s connecting + 2s waiting for a
# reply = 6 seconds before a user is told something went wrong. That is the absolute
# ceiling in a bad situation, not the normal case - normally this whole thing is a few
# milliseconds. The point of a ceiling is that one exists at all.

logging.level.org.springframework.cloud.gateway=DEBUG
