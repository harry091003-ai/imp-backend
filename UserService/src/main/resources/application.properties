spring.application.name=USERSERVICE
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/inicident-management-userservicedb
spring.datasource.username=${user}
spring.datasource.password=${password}

#registering to eureka
eureka.client.service-url.defaultZone=http://localhost:8081/eureka/
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=info,health
management.endpoint.health.show-details=always
# Secret Key and ExpiryTime
jwt.secret=${secretkey}
jwt.expirationMs=3600000

spring.jpa.hibernate.ddl-auto=update

#Kafka Configuration

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# we will use this in future : spring.kafka.consumer.properties.spring.json.type.mapping=userRegisteredEvent:com.project.events.UserRegisteredEvent