spring.application.name=APIGATEWAY
server.port=8082

# --- Who is allowed to reach this service?  (Track B1, step 1 - 2026-09-01) ---
# Before this, the service listened on 0.0.0.0. That means "any network can reach me".
# So anyone who could reach this laptop could skip the gateway and call this service
# directly, sending fake X-User-Id / X-Roles headers and being believed.
#
# 127.0.0.1 means "only this machine". Other computers cannot even connect.
# Real companies do the same thing with a private network or a firewall rule.
#
# BOTH lines are needed, and this is the part that is easy to get wrong:
#   server.address            = which network card we listen on
#   eureka.instance.ip-address = the address we TELL Eureka to give other services
#
# We already have eureka.instance.prefer-ip-address=true, which means "hand out my IP
# address". Without the second line it would keep handing out the laptop LAN address
# (192.168.x.x) while only listening on 127.0.0.1. Then the gateway would call an
# address nothing is listening on, and every service call would fail.
server.address=127.0.0.1
#And this is the IP address to give.
eureka.instance.ip-address=127.0.0.1

# --- The secret handshake  (Track B1, step 2 - 2026-09-02) ---
# We send this word to every service with every request we pass on.
# The service checks it before it believes the X-User-Id / X-Roles headers we add.
#
# Why: those headers are just text. Without this check, anyone who reaches a service directly
# could type "X-Roles: ROLE_ADMIN" and be believed. Step 1 stopped outsiders reaching the
# services at all. This is the second lock, in case the first is ever undone by mistake.
#
# The value comes from the internalsecret environment variable. There is NO default on purpose:
# if it is missing, the gateway refuses to start. A loud failure is much safer than quietly
# starting up and sending no secret at all.
internal.secret=${internalsecret}



eureka.client.service-url.defaultZone=http://localhost:8081/eureka/
#"Give other services my IP address, not my computer name."
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTHSERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**,/roles/**,/logout/**,/password/**,/credentials/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USERSERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[2].id=incident-service
spring.cloud.gateway.routes[2].uri=lb://IncidentService
spring.cloud.gateway.routes[2].predicates[0]=Path=/incidents/**

spring.cloud.gateway.routes[3].id=report-service
spring.cloud.gateway.routes[3].uri=lb://ReportingService
spring.cloud.gateway.routes[3].predicates[0]=Path=/reports/**

spring.cloud.gateway.routes[4].id=ai-service
spring.cloud.gateway.routes[4].uri=lb://AiService
spring.cloud.gateway.routes[4].predicates[0]=Path=/ai/**


jwt.secret=${secretkey}
jwt.expirationMs=3600000

logging.level.org.springframework.cloud.gateway=DEBUG
