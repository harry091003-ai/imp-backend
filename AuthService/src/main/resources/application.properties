spring.application.name=AUTHSERVICE
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/inicident-management-authservicedb
spring.datasource.username=${user}
spring.datasource.password=${password}

#registering to eureka
eureka.client.service-url.defaultZone=http://localhost:8081/eureka/
#eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=info,health
management.endpoint.health.show-details=always

# Secret Key and ExpiryTime
jwt.secret=${secretkey}
jwt.expirationMs=7200000

spring.jpa.hibernate.ddl-auto=update

#Kafka Configurations
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=userRegisteredEvent:com.project.events.UserRegisteredEvent
