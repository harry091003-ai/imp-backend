# --- Production settings  (BCR-04, 2026-11-02) ---
# Used ONLY when the gateway starts with the "prod" profile:
#   environment variable  SPRING_PROFILES_ACTIVE=prod      (or the start option --spring.profiles.active=prod)
# Everything in application.properties still applies; a line here replaces the same line there.
# With no profile (the laptop) none of this is used, so nothing changes while you work.
# GatewayProdProfileTest checks every line below; GatewayLaptopSettingsTest checks the laptop stays the same.

# 1. Normal logs. DEBUG (application.properties) writes a lot of detail about every request: useful on the laptop,
#    too much on a server, and the kind of log where secrets have leaked before (the BCR-04 first piece).
logging.level.org.springframework.cloud.gateway=INFO

# 2. /actuator gets its own door. After deployment nginx passes /api/... to the main port (8082), so without this
#    anyone could open /api/actuator/health, /metrics or /circuitbreakers through nginx and learn about the system.
#    On its own port, open only to this machine, nginx never reaches it. You still can, on the server itself:
#      curl http://127.0.0.1:8092/actuator/health
#    In Docker, "this machine" is the gateway's own container: use  docker exec <container> curl ...
management.server.port=${managementport:8092}
management.server.address=127.0.0.1
