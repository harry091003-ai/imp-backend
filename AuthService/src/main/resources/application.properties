spring.application.name=AUTHSERVICE
server.port=8083

# --- Who is allowed to reach this service?  (Track B1, step 1 - 2026-09-01) ---
# Before this, the service listened on 0.0.0.0. That means "any network can reach me".
# So anyone who could reach this laptop could skip the gateway and call this service
# directly, sending fake X-User-Id / X-Roles headers and being believed.
#
# 127.0.0.1 means "only this machine". Other computers cannot even connect.
# Real companies do the same thing with a private network or a firewall rule.
#
# BOTH lines are needed, and this is the part that is easy to get wrong:
#   server.address            = which network card we listen on
#   eureka.instance.ip-address = the address we TELL Eureka to give other services
#
# We already have eureka.instance.prefer-ip-address=true, which means "hand out my IP
# address". Without the second line it would keep handing out the laptop LAN address
# (192.168.x.x) while only listening on 127.0.0.1. Then the gateway would call an
# address nothing is listening on, and every service call would fail.
server.address=127.0.0.1
#And this is the IP address to give.
eureka.instance.ip-address=127.0.0.1

# --- The secret handshake  (Track B1, step 2 - 2026-09-02) ---
# The word we expect the gateway to send with every request.
# If it is missing or wrong, HeaderAuthFilter ignores the X-User-Id / X-Roles headers on that
# request, so nobody gets logged in and protected endpoints reject it.
#
# This MUST be the same value the gateway uses, or every request will be rejected.
#
# The value comes from the internalsecret environment variable. There is NO default on purpose:
# if it is missing, the service refuses to start with a clear message.
internal.secret=${internalsecret}



spring.datasource.url=jdbc:mysql://localhost:3306/inicident-management-authservicedb
spring.datasource.username=${user}
spring.datasource.password=${password}

#registering to eureka
eureka.client.service-url.defaultZone=http://localhost:8081/eureka/
#"Give other services my IP address, not my computer name."
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=info,health
management.endpoint.health.show-details=always

# Secret Key and ExpiryTime
jwt.secret=${secretkey}
jwt.expirationMs=7200000

# --- Schema management -------------------------------------------------------
# CHANGED 2026-08-29 (was: update).
#   update   = Hibernate silently alters the database to match the entities.
#              It only ever ADDS - it never renames or removes, which is how a
#              renamed field quietly leaves its old column behind, full of data.
#   validate = Hibernate touches NOTHING. On startup it only checks that the
#              entities match the database, and refuses to start if they differ.
# Flyway owns the schema now; this line is the safety check on top of it.
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway ------------------------------------------------------------------
spring.flyway.enabled=true

# Where the .sql files live (this is also Flyway's default; stated explicitly so
# it is obvious where to look).
spring.flyway.locations=classpath:db/migration

# THE IMPORTANT ONE for our situation.
# Our database already exists and already has tables and rows in it. Without this,
# Flyway finds a non-empty database with no history table and refuses to start:
#   "Found non-empty schema(s) but no schema history table."
# With it, Flyway writes a "you are already at version 1" row into
# flyway_schema_history WITHOUT executing V1__baseline.sql, then applies V2 onward.
# On a genuinely empty database this setting does nothing and V1 runs normally.
spring.flyway.baseline-on-migrate=true

# Which version the existing database is assumed to be at. 1 = "V1 is already
# applied here, start real work from V2". This is also the default, written out
# so the intent is visible rather than implied.
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema captured from live DB

#Kafka Configurations
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=userRegisteredEvent:com.project.events.UserRegisteredEvent

# --- Account lockout  (known issues 55 + 6, fixed 2026-10-14) ---
# After this many wrong passwords in a row, the account is locked...
auth.lockout.max-attempts=5
# ...for this many minutes. After that the user may try again (the counter starts from 0).
# A right password always sets the counter back to 0.
auth.lockout.lock-minutes=15
