spring.application.name=Eureka
server.port=8081

# --- Who is allowed to reach Eureka?  (Track B1, step 1 - 2026-09-01) ---
# Eureka holds the list of where every service lives. That list is useful to an
# attacker, so it should not be reachable from other machines.
# 127.0.0.1 means "only this machine".
#
# Eureka does not need the eureka.instance.ip-address line that the services have,
# because it does not register itself anywhere (register-with-eureka=false below).
server.address=127.0.0.1


eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://localhost:8081/eureka/


