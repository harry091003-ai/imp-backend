spring.application.name=AiService
server.port=8088

# Mysql db
# initially ye db ka name inicident-management-aiservicedb rakh tha but as hmko vector db bhi chalana tha so ek db mai dono ka data store krna thaa to posgress es service ki leye use kar rahe hai
# and database ka name bhi change karke vector_db rakh diya hai
spring.datasource.url=jdbc:postgresql://localhost:5433/vector_db
spring.datasource.username=postgres
spring.datasource.password=${password}
spring.jpa.hibernate.ddl-auto=update

#registeringtoeureka
eureka.client.service-url.defaultZone=http://localhost:8081/eureka/
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=info,health
#management.endpoint.health.show-details=always


#KafkaConfiguration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=Ai-service-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


#AiConfigurations
# Google Gemini API key
spring.ai.google.genai.api-key=${apikey}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash-lite
spring.ai.google.genai.chat.options.temperature=0.2


#Embedding model :that we use for converting text data into vector embeddings for storage and retrieval in the vector database.
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.api-key=${apikey}

