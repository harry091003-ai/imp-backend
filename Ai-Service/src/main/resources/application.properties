spring.application.name=AiService
server.port=8088

# --- Who is allowed to reach this service?  (Track B1, step 1 - 2026-09-01) ---
# Before this, the service listened on 0.0.0.0. That means "any network can reach me".
# So anyone who could reach this laptop could skip the gateway and call this service
# directly, sending fake X-User-Id / X-Roles headers and being believed.
#
# 127.0.0.1 means "only this machine". Other computers cannot even connect.
# Real companies do the same thing with a private network or a firewall rule.
#
# BOTH lines are needed, and this is the part that is easy to get wrong:
#   server.address            = which network card we listen on
#   eureka.instance.ip-address = the address we TELL Eureka to give other services
#
# We already have eureka.instance.prefer-ip-address=true, which means "hand out my IP
# address". Without the second line it would keep handing out the laptop LAN address
# (192.168.x.x) while only listening on 127.0.0.1. Then the gateway would call an
# address nothing is listening on, and every service call would fail.
server.address=127.0.0.1
#And this is the IP address to give.
eureka.instance.ip-address=127.0.0.1

# --- The secret handshake  (Track B1, step 2 - 2026-09-02) ---
# The word we expect the gateway to send with every request.
# If it is missing or wrong, HeaderAuthFilter ignores the X-User-Id / X-Roles headers on that
# request, so nobody gets logged in and protected endpoints reject it.
#
# This MUST be the same value the gateway uses, or every request will be rejected.
#
# The value comes from the internalsecret environment variable. There is NO default on purpose:
# if it is missing, the service refuses to start with a clear message.
internal.secret=${internalsecret}



# Mysql db
# initially ye db ka name inicident-management-aiservicedb rakh tha but as hmko vector db bhi chalana tha so ek db mai dono ka data store krna thaa to posgress es service ki leye use kar rahe hai
# and database ka name bhi change karke vector_db rakh diya hai
spring.datasource.url=jdbc:postgresql://localhost:5433/vector_db
spring.datasource.username=postgres
spring.datasource.password=${password}
# --- Schema management -------------------------------------------------------
# CHANGED 2026-09-01 (was: update).
#   update   = Hibernate silently alters the database to match the entities.
#              It only ever ADDS - it never renames or removes.
#   validate = Hibernate touches NOTHING. On startup it only checks that the
#              entities match the database, and refuses to start if they differ.
# Flyway owns the schema now; this line is the safety check on top of it.
#
# NOTE: validate only checks tables that have an @Entity class - so it checks
# ai_insight, and ignores resolved_incidents_vectors entirely. That vector table
# has no entity (Spring AI talks to it directly), which is exactly why it needed
# to be written into the Flyway baseline - nothing else was watching it.
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway ------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Our database already exists and already has tables and data. Without this,
# Flyway finds a non-empty database with no history table and refuses to start:
#   "Found non-empty schema(s) but no schema history table."
# With it, Flyway records "already at version 1" WITHOUT executing
# V1__baseline.sql, then applies V2 onward. On an empty database V1 runs normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema captured from live DB

#registeringtoeureka
eureka.client.service-url.defaultZone=http://localhost:8081/eureka/
#"Give other services my IP address, not my computer name."
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=info,health
#management.endpoint.health.show-details=always


#KafkaConfiguration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=Ai-service-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


#AiConfigurations
# Google Gemini API key
spring.ai.google.genai.api-key=${apikey}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash-lite
spring.ai.google.genai.chat.options.temperature=0.2


#Embedding model :that we use for converting text data into vector embeddings for storage and retrieval in the vector database.
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.api-key=${apikey}

